name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 uses node:sqlite and requires Node 22.13 or newer.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: node apps/cli/dist/index.js demo acquisition --json
      - run: node scripts/generate-sbom.mjs
      - run: pnpm sbom --sbom-format cyclonedx --out acquisition/SBOM.cyclonedx.json
